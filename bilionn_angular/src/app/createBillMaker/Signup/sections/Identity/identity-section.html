<h3 class="section-title">Identity (optional)</h3>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>PAN number</mat-label>
        <input matInput type="text" style="text-transform: uppercase" [formField]="form().panNumber" placeholder="ABCDE1234F" />
        <!-- @if (form().panNumber().invalid() && form().panNumber().touched()) {
          <mat-error>{{ form().panNumber().errors()[0].message }}</mat-error>
        } -->
              <app-validation-message [receivedField]="form().panNumber"> </app-validation-message>

      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Aadhaar number</mat-label>
        <input matInput type="text" inputmode="numeric" [formField]="form().aadhaarNumber" placeholder="123456789012" />
        <!-- @if (form().aadhaarNumber().invalid() && form().aadhaarNumber().touched()) {
          <mat-error>{{ form().aadhaarNumber().errors()[0].message }}</mat-error>
        } -->
              <app-validation-message [receivedField]="form().aadhaarNumber"> </app-validation-message>

      </mat-form-field>
    </div>
