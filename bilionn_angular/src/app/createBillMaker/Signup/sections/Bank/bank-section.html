<h3 class="section-title">Bank details</h3>

    <div class="field-grid">
      <mat-form-field appearance="outline">
        <mat-label>Account holder name</mat-label>
        <input matInput type="text" [formField]="form().accountHolderName" />
        <!-- @if (form().accountHolderName().invalid() && form().accountHolderName().touched()) {
          <mat-error>{{ form().accountHolderName().errors()[0].message }}</mat-error>
        } -->
              <app-validation-message [receivedField]="form().accountHolderName"> </app-validation-message>

      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Bank name</mat-label>
        <input matInput type="text" [formField]="form().bankName" />
        <!-- @if (form().bankName().invalid() && form().bankName().touched()) {
          <mat-error>{{ form().bankName().errors()[0].message }}</mat-error>
        } -->
              <app-validation-message [receivedField]="form().bankName"> </app-validation-message>

      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Account number</mat-label>
        <input matInput type="text" inputmode="numeric" [formField]="form().accountNumber" />
        <!-- @if (form().accountNumber().invalid() && form().accountNumber().touched()) {
          <mat-error>{{ form().accountNumber().errors()[0].message }}</mat-error>
        } -->
              <app-validation-message [receivedField]="form().accountNumber"> </app-validation-message>

      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>IFSC code</mat-label>
        <input matInput type="text" style="text-transform: uppercase" [formField]="form().ifscCode" placeholder="ABCD0123456"  />
        <!-- @if (form().ifscCode().invalid() && form().ifscCode().touched()) {
          <mat-error>{{ form().ifscCode().errors()[0].message }}</mat-error>
        } -->
              <app-validation-message [receivedField]="form().ifscCode"> </app-validation-message>

      </mat-form-field>
    </div>
